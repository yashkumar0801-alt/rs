<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - rojgar Setu</title>
  <!-- Google Fonts: Playfair Display + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div class="screen-layout">
    <!-- Top Navigation Overlay -->
    <header class="top-nav">
      <!-- Clickable Back Button pointing to home.html -->
      <a href="home.html" class="nav-back">
        <span class="arrow">&larr;</span> Back to home
      </a>

      <!-- Unclickable Brand Logo & Title -->
      <div class="brand">
        <span class="brand-square">R</span>
        <span class="brand-title">rojgar <strong>Setu</strong></span>
      </div>
    </header>

    <!-- Centered Dark Glass Form Section -->
    <main class="login-wrapper">
      <div class="dark-panel">
        <div class="panel-header">
          <span class="eyebrow">WELCOME BACK</span>
          <h1 class="headline">Sign in to your account</h1>
          <p class="subheadline">Access your bookings and managed services.</p>
        </div>

        <form action="javascript:void(0);" method="POST" class="form-container">
          <div class="form-field">
            <label for="email">EMAIL ADDRESS</label>
            <div class="input-shell">
              <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="you@example.com" 
                autocomplete="email"
                required 
              />
            </div>
          </div>

          <div class="form-field">
            <div class="field-meta">
              <label for="password">PASSWORD</label>
              <a href="#" class="forgot-link">Forgot?</a>
            </div>
            <div class="input-shell">
              <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Enter your password" 
                autocomplete="current-password"
                required 
              />
            </div>
          </div>

          <button type="submit" class="submit-button">
            <span>Sign in</span>
            <span class="btn-arrow">&rarr;</span>
          </button>
        </form>

        <footer class="panel-footer">
          <p>Don't have an account? <a href="signup.html" class="signup-link">Create account</a></p>
        </footer>
      </div>
    </main>
  </div>
</body>
</html>
